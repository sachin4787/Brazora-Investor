name: Capture live website screenshots

on:
  push:
    branches: [main]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages update
        run: sleep 30
      - name: Capture live pages
        run: |
          cat > capture.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('https://sachin4787.github.io/Brazora-Investor/', {waitUntil:'networkidle', timeout:120000});
            await page.screenshot({path:'brazora-live-full.png', fullPage:true});
            const sections = await page.locator('main > section').evaluateAll(els => els.map((e,i)=>({i, id:e.id, top:e.getBoundingClientRect().top + window.scrollY, height:e.getBoundingClientRect().height})));
            fs.writeFileSync('sections.json', JSON.stringify(sections, null, 2));
            for (const s of sections) {
              await page.evaluate(y => window.scrollTo(0,y), s.top);
              await page.waitForTimeout(250);
              await page.screenshot({path:`section-${String(s.i+1).padStart(2,'0')}-${s.id||'section'}.png`, fullPage:false});
            }
            await browser.close();
          })();
          EOF
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node capture.js
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: brazora-live-screenshots
          path: |
            brazora-live-full.png
            section-*.png
            sections.json
